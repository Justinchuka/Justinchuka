nt-size="12.5" font-weight="600" fill="#DDD6FE">City Business AI  ·  London, UK (Remote)</text><text x="188" y="276" font-size="12.5" fill="#9AA4B2">Lead product strategy and development for BuiltSpaces, an AI-assisted community engagement</text><text x="188" y="294" font-size="12.5" fill="#9AA4B2">platform, coordinating a five-person cross-functional team.</text><rect x="781.1" y="219" width="82.9" height="22" rx="11" fill="#8B5CF6" fill-opacity=".12" stroke="#8B5CF6" stroke-opacity=".38"/><text x="822.55" y="233.78" font-size="10.5" font-weight="600" text-anchor="middle" fill="#DDD6FE">AI product</text><line x1="36" y1="314" x2="864" y2="314" stroke="#FFFFFF" stroke-opacity=".06"/><text x="140" y="342" font-size="12.5" font-weight="700" text-anchor="end" fill="#E6EDF3">Mar 2023 –</text><text x="140" y="360" font-size="12.5" text-anchor="end" fill="#9AA4B2">Aug 2023</text><circle cx="164.5" cy="339" r="5" fill="#0E1322" stroke="#22D3EE" stroke-width="2"/><text x="188" y="344" font-size="16" font-weight="700" fill="#FFFFFF">Product Designer (Contract)</text><text x="188" y="363" font-size="12.5" font-weight="600" fill="#A5F3FC">Orodata Science  ·  Lagos, Nigeria</text><text x="188" y="384" font-size="12.5" fill="#9AA4B2">Designed public-health and civic data products including Alpaca Index, CheckMyPHC, PHC</text><text x="188" y="402" font-size="12.5" fill="#9AA4B2">Navigator, PHC Triage and the Africa Data Hub Vaccine Tracker.</text><rect x="781.1" y="327" width="82.9" height="22" rx="11" fill="#22D3EE" fill-opacity=".12" stroke="#22D3EE" stroke-opacity=".38"/><text x="822.55" y="341.78" font-size="10.5" font-weight="600" text-anchor="middle" fill="#A5F3FC">Civic tech</text><line x1="36" y1="422" x2="864" y2="422" stroke="#FFFFFF" stroke-opacity=".06"/><text x="140" y="450" font-size="12.5" font-weight="700" text-anchor="end" fill="#E6EDF3">Nov 2022 –</text><text x="140" y="468" font-size="12.5" text-anchor="end" fill="#9AA4B2">Feb 2024</text><circle cx="164.5" cy="447" r="5" fill="#0E1322" stroke="#8B5CF6" stroke-width="2"/><text x="188" y="452" font-size="16" font-weight="700" fill="#FFFFFF">Lead Product Designer</text><text x="188" y="471" font-size="12.5" font-weight="600" fill="#DDD6FE">Traavu Global  ·  London, UK (Remote)</text><text x="188" y="492" font-size="12.5" fill="#9AA4B2">Led product design for eligibility assessment and relocation journeys. A research-informed</text><text x="188" y="510" font-size="12.5" fill="#9AA4B2">onboarding redesign cut bounce rate by about 30%.</text><rect x="793.28" y="435" width="70.72" height="22" rx="11" fill="#8B5CF6" fill-opacity=".12" stroke="#8B5CF6" stroke-opacity=".38"/><text x="828.64" y="449.78" font-size="10.5" font-weight="600" text-anchor="middle" fill="#DDD6FE">Mobility</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>