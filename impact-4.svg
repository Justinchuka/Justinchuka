<svg xmlns="http://www.w3.org/2000/svg" width="225" height="144" viewBox="0 0 225 144" fill="none" role="img" aria-label="12 person cross-functional team">
  <defs>
    <linearGradient id="gv" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
    <linearGradient id="gt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFF"/><stop offset=".55" stop-color="#D8CCFF"/><stop offset="1" stop-color="#7EE8FA"/></linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF" stop-opacity=".055"/><stop offset="1" stop-color="#FFF" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .m{font-family:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(12px,7px)}}
    .in{animation:rise .8s cubic-bezier(.2,.7,.2,1) backwards}
    .d1{animation-delay:.1s}.d2{animation-delay:.25s}.d3{animation-delay:.4s}
    .orb{animation:float 14s ease-in-out infinite}
  </style>
  <rect x="9.5" y=".5" width="215" height="131" rx="16" fill="#0E1322" stroke="#FFF" stroke-opacity=".09"/>
  <rect x="9.5" y=".5" width="215" height="131" rx="16" fill="url(#sheen)"/>
  <circle class="orb" cx="46" cy="35" r="24" fill="#8B5CF6" opacity=".055" filter="url(#glow)"/>
  <rect x="103" y="1" width="28" height="3" rx="1.5" fill="url(#gv)"/>
  <text class="in d1" x="117" y="62" font-size="36" font-weight="800" text-anchor="middle" fill="url(#gt)">12</text>
  <text class="in d2" x="117" y="88" font-size="12.5" text-anchor="middle" fill="#C9D1D9">person cross-functional team</text>
  <text class="m in d3" x="117" y="112" font-size="9.5" letter-spacing="1.3" text-anchor="middle" fill="#6B7280">CITY BUSINESS AI</text>
</svg>
