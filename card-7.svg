<svg xmlns="http://www.w3.org/2000/svg" width="300" height="256" viewBox="0 0 300 256" fill="none" role="img" aria-label="Vaccine Tracker: Interactive dashboard of COVID-19 vaccination progress, distribution and country comparisons across Africa." xmlns:c2pa="http://c2pa.org/manifest"><style>
text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.m{font-family:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes floatA{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,16px)}}
@keyframes floatB{0%,100%{transform:translate(0,0)}50%{transform:translate(-34px,-12px)}}
@keyframes dash{to{stroke-dashoffset:-36}}
@keyframes pulse{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
@keyframes ring{0%{opacity:.6;transform:scale(1)}100%{opacity:0;transform:scale(2)}}
.in{animation:rise .8s cubic-bezier(.2,.7,.2,1) backwards}
.d1{animation-delay:.1s}.d2{animation-delay:.25s}.d3{animation-delay:.4s}.d4{animation-delay:.55s}.d5{animation-delay:.7s}
.oA{animation:floatA 14s ease-in-out infinite}.oB{animation:floatB 16s ease-in-out infinite}
.flow{stroke-dasharray:4 7;animation:dash 1.6s linear infinite}
.dot{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-in-out infinite}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2.8s ease-out infinite}
</style><defs>
<linearGradient id="gv" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
<linearGradient id="gt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#D8CCFF"/><stop offset="1" stop-color="#7EE8FA"/></linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".055"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8B5CF6" stop-opacity="0"/><stop offset=".3" stop-color="#8B5CF6"/><stop offset=".7" stop-color="#22D3EE"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs><rect x="0.5" y=".5" width="288.333" height="243" rx="16" fill="#0E1322" stroke="#FFFFFF" stroke-opacity=".09"/><rect x="0.5" y=".5" width="288.333" height="243" rx="16" fill="url(#sheen)"/><rect x="24" y="1" width="28" height="3" rx="1.5" fill="#22D3EE"/><text class="m" x="24" y="40" font-size="10.5" letter-spacing="1.8" fill="#A5F3FC" text-anchor="start">AFRICA DATA HUB</text><text class="m" x="265.333" y="40" font-size="10.5" text-anchor="end" fill="#6B7280">07</text><text x="24" y="72" font-size="18" font-weight="800" fill="#FFFFFF">Vaccine Tracker</text><text x="24" y="98" font-size="12.5" fill="#9AA4B2">Interactive dashboard of COVID-19</text><text x="24" y="116" font-size="12.5" fill="#9AA4B2">vaccination progress, distribution</text><text x="24" y="134" font-size="12.5" fill="#9AA4B2">and country comparisons across</text><text x="24" y="152" font-size="12.5" fill="#9AA4B2">Africa.</text><rect x="24" y="198" width="84.5644" height="22" rx="11" fill="#22D3EE" fill-opacity=".12" stroke="#22D3EE" stroke-opacity=".38"/><text x="66.2822" y="212.78" font-size="10.5" font-weight="600" text-anchor="middle" fill="#A5F3FC">Dashboard</text><rect x="114.564" y="198" width="78.4744" height="22" rx="11" fill="#22D3EE" fill-opacity=".12" stroke="#22D3EE" stroke-opacity=".38"/><text x="153.802" y="212.78" font-size="10.5" font-weight="600" text-anchor="middle" fill="#A5F3FC">Data viz</text><rect x="199.039" y="198" width="66.2944" height="22" rx="11" fill="#22D3EE" fill-opacity=".12" stroke="#22D3EE" stroke-opacity=".38"/><text x="232.186" y="212.78" font-size="10.5" font-weight="600" text-anchor="middle" fill="#A5F3FC">Africa</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>