</defs><rect x="0.5" y=".5" width="899" height="451" rx="16" fill="#0E1322" stroke="#FFFFFF" stroke-opacity=".09"/><rect x="0.5" y=".5" width="899" height="451" rx="16" fill="url(#sheen)"/><text class="m" x="36" y="44" font-size="10.5" letter-spacing="1.8" fill="#DDD6FE" text-anchor="start">ABOUT</text><text x="36" y="78" font-size="22" font-weight="800" fill="#FFFFFF">Applied AI product builder &amp; strategist</text><text x="36" y="116" font-size="14" fill="#C9D1D9">I'm an engineering-trained applied AI product builder and</text><text x="36" y="139" font-size="14" fill="#C9D1D9">product strategist. I turn complex public-interest,</text><text x="36" y="162" font-size="14" fill="#C9D1D9">organisational and operational challenges into practical</text><text x="36" y="185" font-size="14" fill="#C9D1D9">digital products.</text><text x="36" y="222" font-size="14" fill="#C9D1D9">My work blends product discovery, human-centred design, AI-</text><text x="36" y="245" font-size="14" fill="#C9D1D9">assisted development, API integration and AI product</text><text x="36" y="268" font-size="14" fill="#C9D1D9">evaluation, across public-health technology in Nigeria,</text><text x="36" y="291" font-size="14" fill="#C9D1D9">organisational AI readiness, stakeholder intelligence and</text><text x="36" y="314" font-size="14" fill="#C9D1D9">global mobility.</text><text x="36" y="351" font-size="14" fill="#C9D1D9">I direct AI coding tools, work with APIs and evaluate AI-</text><text x="36" y="374" font-size="14" fill="#C9D1D9">generated output, and I'm keen to apply responsible, human-</text><text x="36" y="397" font-size="14" fill="#C9D1D9">centred AI to strengthen health systems, institutions and</text><text x="36" y="420" font-size="14" fill="#C9D1D9">development outcomes.</text><line x1="556.5" y1="36" x2="556.5" y2="416" stroke="#FFFFFF" stroke-opacity=".08"/><text class="m" x="588" y="44" font-size="10.5" letter-spacing="1.8" fill="#A5F3FC" text-anchor="start">FOCUS AREAS</text><circle cx="596" cy="91" r="4" fill="#8B5CF6"/><text x="612" y="96" font-size="14" font-weight="700" fill="#E6EDF3">Applied AI &amp; LLM workflows</text><text x="612" y="116" font-size="12" fill="#9AA4B2">Agents, APIs, prototyping, evaluation</text><circle cx="596" cy="157" r="4" fill="#22D3EE"/><text x="612" y="162" font-size="14" font-weight="700" fill="#E6EDF3">Product strategy</text><text x="612" y="182" font-size="12" fill="#9AA4B2">Discovery, roadmapping, systems thinking</text><circle cx="596" cy="223" r="4" fill="#4ADE80"/><text x="612" y="228" font-size="14" font-weight="700" fill="#E6EDF3">Experience design</text><text x="612" y="248" font-size="12" fill="#9AA4B2">UX/UI, research, design systems</text><circle cx="596" cy="289" r="4" fill="#8B5CF6"/><text x="612" y="294" font-size="14" font-weight="700" fill="#E6EDF3">Decision-support products</text><text x="612" y="314" font-size="12" fill="#9AA4B2">Dashboards, assessments, insight</text><circle cx="596" cy="355" r="4" fill="#22D3EE"/><text x="612" y="360" font-size="14" font-weight="700" fill="#E6EDF3">AI governance &amp; readiness</text><text x="612" y="380" font-size="12" fill="#9AA4B2">Maturity, adoption, risk awareness</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>